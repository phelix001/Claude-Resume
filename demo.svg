  <text x="558" y="108" font-size="12" fill="#e0af68" font-weight="bold">Summary</text>
  <text x="570" y="126" font-size="11.5" fill="#a9b1d6">Fix the authentication bug where</text>
  <text x="570" y="142" font-size="11.5" fill="#a9b1d6">login tokens expire prematurely</text>
  <text x="570" y="158" font-size="11.5" fill="#a9b1d6">on mobile browsers</text>

