  <text x="558" y="322" font-size="12" fill="#e0af68" font-weight="bold">Branch</text>
  <text x="650" y="322" font-size="11.5" fill="#c0caf5">fix/jwt-refresh</text>

  <text x="558" y="344" font-size="12" fill="#e0af68" font-weight="bold">Messages</text>
