  <text x="570" y="204" font-size="11.5" fill="#a9b1d6">The JWT refresh token flow is</text>
  <text x="570" y="220" font-size="11.5" fill="#a9b1d6">broken on Safari — users get</text>
  <text x="570" y="236" font-size="11.5" fill="#a9b1d6">logged out after 5 minutes. Can</text>
  <text x="570" y="252" font-size="11.5" fill="#a9b1d6">you investigate the token rotation</text>
  <text x="570" y="268" font-size="11.5" fill="#a9b1d6">logic in auth.ts?</text>

  <text x="558" y="300" font-size="12" fill="#e0af68" font-weight="bold">Project</text>
